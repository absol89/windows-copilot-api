name: Native release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            arch: x64
          - name: Windows ARM64
            runner: windows-11-arm
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            arch: x64
          - name: macOS ARM64
            runner: macos-15
            arch: arm64
          - name: Linux x64
            runner: ubuntu-22.04
            arch: x64
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install bundled Chromium fallback
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: python -m playwright install chromium
      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build native bundle
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          WINDOWS_COPILOT_API_VERSION: ${{ github.ref_name }}
        run: python scripts/build_native_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write release checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --generate-notes
